<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TORN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { height:100%; font-family:'JetBrains Mono',monospace; background:#000000; color:#ffffff; overflow:hidden }

  .container { display:flex; flex-direction:column; height:100%; background:linear-gradient(135deg,#000000,#1a1a1a,#000000) }

  .header {
    padding:20px;
    background:linear-gradient(180deg, rgba(20,20,25,0.95) 0%, rgba(20,20,25,0.6) 100%);
    border-bottom:2px solid #a855f7;
    flex-shrink:0
  }

  .dots { display:flex; gap:8px; margin-bottom:14px }
  .dot { width:10px; height:10px; border-radius:50%; box-shadow:0 0 8px currentColor }
  .dot.d1 { background:#ff5f56 }
  .dot.d2 { background:#ffbd2e }
  .dot.d3 { background:#27c93f }

  .title { font-size:12px; color:#a1b2d1; margin-bottom:12px; letter-spacing:1px }

  .logo {
    font-size:9px;
    color:#a855f7;
    line-height:1.1;
    text-shadow:0 0 20px rgba(168,85,247,0.4);
    margin-bottom:6px;
    white-space:pre;
  }

  .subtitle { font-size:11px; color:#a1b2d1; margin-bottom:16px }
  .subtitle strong { color:#a855f7 }

  .search-box {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  input {
    flex:1;
    min-width:100px;
    padding:10px 12px;
    background:rgba(20,20,25,0.9);
    border:1.5px solid #a855f7;
    border-radius:6px;
    color:#a855f7;
    font:600 14px 'JetBrains Mono',monospace;
  }

  input:focus { outline:none; box-shadow:0 0 15px rgba(168,85,247,0.4) }
  input::placeholder { color:#6b7d8f }

  button {
    padding:10px 18px;
    background:linear-gradient(135deg, #a855f7, #c084fc);
    color:#000000;
    border:0;
    border-radius:6px;
    font:600 13px 'JetBrains Mono',monospace;
    cursor:pointer;
    text-transform:uppercase;
    transition:all 0.2s;
    box-shadow:0 0 15px rgba(168,85,247,0.3);
  }

  button:hover { transform:translateY(-2px); box-shadow:0 0 25px rgba(168,85,247,0.5) }
  button:active { transform:translateY(0) }

  .content { flex:1; overflow:hidden; display:flex; flex-direction:column }

  iframe {
    flex:1;
    border:1.5px solid #a855f7;
    border-radius:6px;
    margin:14px;
    background:#000000;
    color:#ffffff;
  }

  .footer {
    padding:10px 20px;
    background:rgba(20,20,25,0.95);
    border-top:1px solid #a855f7;
    font-size:11px;
    color:#6b7d8f;
    flex-shrink:0;
  }

  @media (max-width:640px) {
    .header { padding:14px }
    .logo { font-size:7px }
    .search-box { gap:8px }
    input { font-size:13px }
    iframe { margin:8px }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="dots">
      <div class="dot d1"></div>
      <div class="dot d2"></div>
      <div class="dot d3"></div>
    </div>
    <div class="title">torn@lookup: ~</div>

    <pre class="logo">████████╗ ██████╗ ██████╗ ███╗   ██╗
╚══██╔══╝██╔═══██╗██╔══██╗████╗  ██║
   ██║   ██║   ██║██████╔╝██╔██╗ ██║
   ██║   ██║   ██║██╔══██╗██║╚██╗██║
   ██║   ╚██████╔╝██║  ██║██║ ╚████║
   ╚═╝    ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═══╝</pre>

    <div class="subtitle">Lookup Console • <strong>TORN</strong></div>

    <div class="search-box">
      <input id="num" type="tel" placeholder="Enter 10 digits..." maxlength="10" autofocus>
      <button onclick="search()">Search</button>
    </div>
  </div>

  <div class="content">
    <iframe id="result" sandbox="allow-same-origin"></iframe>
  </div>

  <div class="footer">TORN © 2026 • Direct API Load • Zero Lag</div>
</div>

<script>
const API = "https://info-api-redzone.vercel.app/api/lookup?type=num&query=";

function search() {
  const num = document.getElementById("num").value.trim();
  if (!num) return alert("Enter a number!");
  const url = API + encodeURIComponent(num);
  document.getElementById("result").src = url;
}

document.getElementById("num").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 10);
});

document.getElementById("num").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});
</script>
</body>
</html>
